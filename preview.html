<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shaale-Vikas Interactive Preview</title>
    <style>
        :root {
            --primary-blue: #2563EB;
            --secondary-emerald: #10B981;
            --dark-bg: #0F172A;
            --surface-light: #F8FAFC;
            --text-gray: #64748B;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #E2E8F0;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .phone-frame {
            width: 360px;
            height: 740px;
            background-color: white;
            border-radius: 40px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.3);
            overflow: hidden;
            position: relative;
            border: 12px solid #1E293B;
        }
        .status-bar {
            height: 34px;
            background: #fff;
            display: flex;
            justify-content: space-between;
            padding: 0 24px;
            align-items: center;
            font-size: 12px;
            font-weight: 600;
            color: #1E293B;
        }
        .screen {
            height: calc(100% - 34px);
            width: 100%;
            position: absolute;
            top: 34px;
            left: 0;
            transition: transform 0.3s ease-in-out;
            background: white;
            display: none;
            flex-direction: column;
        }
        .screen.active { display: flex; }
        
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            box-sizing: border-box;
        }

        /* Elements */
        .btn {
            height: 56px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            border: none;
            width: 100%;
            margin-bottom: 16px;
            gap: 12px;
        }
        .btn-primary { background: var(--primary-blue); color: white; }
        .btn-dark { background: var(--dark-bg); color: white; }
        
        .logo-box {
            width: 100px;
            height: 100px;
            background: rgba(37, 99, 235, 0.1);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 40px auto 24px;
        }

        /* Registration Screen */
        .input-group { margin-bottom: 16px; }
        .input-group label { display: block; font-size: 12px; color: var(--text-gray); margin-bottom: 8px; font-weight: 600; }
        .input-group input {
            width: 100%;
            height: 56px;
            border: 1px solid #E2E8F0;
            border-radius: 16px;
            padding: 0 16px;
            box-sizing: border-box;
            font-size: 16px;
        }

        /* Card Styles */
        .card {
            background: white;
            border-radius: 24px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -1px rgba(0,0,0,0.06);
            border: 1px solid #F1F5F9;
            overflow: hidden;
            margin-bottom: 16px;
        }
        .card-img {
            height: 160px;
            background: #CBD5E1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }
        .urgent-badge {
            position: absolute;
            top: 12px;
            left: 12px;
            background: #EF4444;
            color: white;
            font-size: 10px;
            font-weight: 900;
            padding: 4px 8px;
            border-radius: 4px;
        }
        .card-body { padding: 16px; }
        .card-title { font-weight: 800; font-size: 16px; color: var(--dark-bg); }
        .card-school { font-size: 12px; color: var(--text-gray); margin-top: 4px; }

        .progress-bar { height: 8px; background: #F1F5F9; border-radius: 4px; margin-top: 12px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--secondary-emerald); }

        /* Navigation */
        .bottom-nav {
            height: 72px;
            background: white;
            border-top: 1px solid #F1F5F9;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding-bottom: 8px;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-gray);
            font-size: 10px;
            font-weight: 600;
            cursor: pointer;
        }
        .nav-item.active { color: var(--primary-blue); }
        .nav-icon { font-size: 20px; margin-bottom: 4px; }

    </style>
</head>
<body>
    <div class="phone-frame">
        <div class="status-bar">
            <span>12:45</span>
            <span style="gap: 4px; display: flex;">📶 🔋</span>
        </div>

        <!-- LANDING -->
        <div class="screen active" id="screen-landing">
            <div class="content">
                <div class="logo-box"><span style="font-size: 48px;">⭐</span></div>
                <h1 style="text-align: center; font-weight: 900; margin: 0;">Shaale-Vikas</h1>
                <p style="text-align: center; color: var(--text-gray); font-size: 14px; margin: 16px 0 40px;">The transparent bridge connecting Rural Schools with Global Alumni.</p>
                <button class="btn btn-dark" onclick="showScreen('screen-login', 'Headmaster')">👤 Login as Headmaster</button>
                <button class="btn btn-primary" onclick="showScreen('screen-login', 'Alumni')">😊 Login as Alumni</button>
            </div>
        </div>

        <!-- LOGIN / REG -->
        <div class="screen" id="screen-login">
            <div style="padding: 16px; display: flex; align-items: center;">
                <span style="cursor: pointer; font-size: 20px;" onclick="showScreen('screen-landing')">←</span>
                <span id="login-title" style="margin-left: 16px; font-weight: 800; font-size: 18px;">Registration</span>
            </div>
            <div class="content">
                <div class="input-group">
                    <label>FULL NAME</label>
                    <input type="text" placeholder="John Doe">
                </div>
                <div class="input-group">
                    <label id="unique-field-label">UNIQUE ID</label>
                    <input type="text" placeholder="...">
                </div>
                <div class="input-group">
                    <label>EMAIL ADDRESS</label>
                    <input type="email" placeholder="john@example.com">
                </div>
                <div class="input-group">
                    <label>PASSWORD</label>
                    <input type="password" placeholder="••••••••">
                </div>
                <button class="btn btn-primary" style="margin-top: 20px;" onclick="showScreen('screen-main')">Join Network</button>
            </div>
        </div>

        <!-- MAIN APP -->
        <div class="screen" id="screen-main" style="background: var(--surface-light);">
            <div class="content" style="padding: 20px;">
                <h2 style="font-weight: 900; margin-bottom: 20px;">Global Needs</h2>
                
                <div class="card">
                    <div class="card-img" style="background: linear-gradient(45deg, #3B82F6, #2563EB);">
                        <div class="urgent-badge">URGENT</div>
                        <span style="color: white; opacity: 0.8;">🏠</span>
                        <div style="position: absolute; bottom: 12px; right: 12px; color: white; font-weight: 700; font-size: 11px;">GHS Malgudi</div>
                    </div>
                    <div class="card-body">
                        <div class="card-title">Fix Leaking Roof</div>
                        <div style="display: flex; justify-content: space-between; margin-top: 12px; font-size: 11px; font-weight: 700;">
                            <span style="color: var(--secondary-emerald);">60% Funded</span>
                            <span style="color: var(--text-gray);">Goal: ₹10,000</span>
                        </div>
                        <div class="progress-bar"><div class="progress-fill" style="width: 60%;"></div></div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-img" style="background: linear-gradient(45deg, #10B981, #059669);">
                        <span style="color: white; opacity: 0.8;">🔬</span>
                        <div style="position: absolute; bottom: 12px; right: 12px; color: white; font-weight: 700; font-size: 11px;">Govt Primary, Hassan</div>
                    </div>
                    <div class="card-body">
                        <div class="card-title">Science Lab Equipment</div>
                        <div style="display: flex; justify-content: space-between; margin-top: 12px; font-size: 11px; font-weight: 700;">
                            <span style="color: var(--secondary-emerald);">20% Funded</span>
                            <span style="color: var(--text-gray);">Goal: ₹25,000</span>
                        </div>
                        <div class="progress-bar"><div class="progress-fill" style="width: 20%;"></div></div>
                    </div>
                </div>
            </div>
            
            <div class="bottom-nav">
                <div class="nav-item"><span>🏠</span><span>Dash</span></div>
                <div class="nav-item active"><span>📋</span><span>Needs</span></div>
                <div class="nav-item"><span>✅</span><span>Impact</span></div>
                <div class="nav-item"><span>⭐</span><span>Donors</span></div>
                <div class="nav-item"><span>⚙️</span><span>Settings</span></div>
            </div>
        </div>
    </div>

    <script>
        function showScreen(screenId, type) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
            
            if (type) {
                document.getElementById('login-title').innerText = type + ' Registration';
                document.getElementById('unique-field-label').innerText = type === 'Headmaster' ? 'OFFICIAL UDISE CODE' : 'PASSING YEAR';
            }
        }
    </script>
</body>
</html>
